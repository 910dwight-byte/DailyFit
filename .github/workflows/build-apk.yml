name: Build DailyFit APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract DailyFit source ZIP
        run: |
          rm -rf dailyfit-source
          mkdir -p dailyfit-source
          unzip -q DailyFit-Source-Phone-Upload.zip -d dailyfit-source

      - name: Configure AndroidX and JVM
        run: |
          cat > dailyfit-source/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path("dailyfit-source/app/build.gradle.kts")
          s = p.read_text()

          # Force Java 17.
          if "compileOptions" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """,
                  1
              )

          # Force Kotlin 17.
          if "kotlinOptions" not in s and "jvmToolchain" not in s:
              s = s.replace(
                  "android {",
                  """android {
              kotlinOptions {
                  jvmTarget = "17"
              }
          """,
                  1
              )

          p.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Show build configuration
        working-directory: dailyfit-source
        run: |
          echo "===== gradle.properties ====="
          cat gradle.properties
          echo "===== app/build.gradle.kts ====="
          cat app/build.gradle.kts
          echo "===== Java ====="
          java -version
          echo "===== Gradle ====="
          gradle --version

      - name: Build DailyFit APK
        working-directory: dailyfit-source
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tee ../dailyfit-build.log

      - name: Upload DailyFit APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DailyFit-debug-apk
          path: dailyfit-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DailyFit-build-log
          path: dailyfit-build.log
          if-no-files-found: warn
