name: Build DailyFit APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract DailyFit source ZIP
        run: |
          mkdir -p dailyfit-source
          unzip -q DailyFit-Source-Phone-Upload.zip -d dailyfit-source

      - name: Configure AndroidX
        run: |
          printf '%s\n' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' \
            > dailyfit-source/gradle.properties

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build DailyFit APK
        working-directory: dailyfit-source
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload DailyFit APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyFit-debug-apk
          path: dailyfit-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
